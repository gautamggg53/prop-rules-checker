[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "prop-rules-checker"
version = "0.1.0"
description = "Check a trade history against prop-firm style rules (daily loss, drawdown, consistency, news, weekend, lot size) and flag violations and near-misses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gautam Goyal" }]
requires-python = ">=3.10"
keywords = ["trading", "prop firm", "risk", "drawdown", "metatrader", "ctrader", "tradingview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1.0"]

[project.scripts]
prop-rules-check = "prop_rules_checker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prop_rules_checker"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "schema", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["prop_rules_checker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
